<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f4d3f" />
      <stop offset="50%" stop-color="#2f6b55" />
      <stop offset="100%" stop-color="#1a3b30" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#22c55e" />
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#c084fc" />
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#facc15" />
    </marker>
  </defs>

  <style>
    .layer-title { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .card-title { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .card-subtitle { font-size: 11px; fill: #94a3b8; }
    .badge { font-size: 10px; font-weight: 600; }
    .tag { font-size: 9.5px; fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Header -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="url(#headerGrad)" />
  <text x="50" y="52" fill="#86efac" font-size="12" font-weight="700" letter-spacing="1">VISÃO GERAL DO SISTEMA</text>
  <text x="50" y="74" fill="#ffffff" font-size="19" font-weight="800">Diagrama de Arquitetura em 5 Camadas — Reconecta 50+</text>
  <text x="50" y="87" fill="#cbd5e1" font-size="11.5">Cliente ➔ Frontend (Vercel) ➔ API &amp; Guardrails (Render) ➔ Serviços, Dual-Engine IA &amp; Dados ➔ CI/CD &amp; Qualidade</text>

  <!-- ==================== CAMADA 1: CLIENTE ==================== -->
  <g transform="translate(30, 115)">
    <!-- Layer Header & Line -->
    <text x="0" y="12" fill="#38bdf8" class="layer-title">CAMADA CLIENTE (USUÁRIO 50+)</text>
    <line x1="230" y1="8" x2="1140" y2="8" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card 1: Navegador SPA -->
    <rect x="0" y="24" width="360" height="78" rx="10" fill="#111827" stroke="#0284c7" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="18" y="50" class="card-title">🌐 Navegador Web (SPA)</text>
    <text x="18" y="68" class="card-subtitle">Interface responsiva, acolhedora e otimizada para público maduro</text>
    <rect x="18" y="76" width="75" height="18" rx="4" fill="#0369a1" />
    <text x="24" y="89" fill="#e0f2fe" class="tag">React 19</text>
    <rect x="98" y="76" width="60" height="18" rx="4" fill="#1e3a5f" />
    <text x="104" y="89" fill="#93c5fd" class="tag">Vite 6</text>
    <rect x="163" y="76" width="85" height="18" rx="4" fill="#1e293b" />
    <text x="169" y="89" fill="#cbd5e1" class="tag">TypeScript 5</text>

    <!-- Card 2: Entrada por Voz & Áudio -->
    <rect x="380" y="24" width="370" height="78" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="398" y="50" class="card-title">🎙️ Entrada por Voz &amp; Gravação</text>
    <text x="398" y="68" class="card-subtitle">Fale em vez de digitar: relato espontâneo da história profissional</text>
    <rect x="398" y="76" width="125" height="18" rx="4" fill="#581c87" />
    <text x="404" y="89" fill="#e9d5ff" class="tag">Web Speech API</text>
    <rect x="528" y="76" width="105" height="18" rx="4" fill="#3b0764" />
    <text x="534" y="89" fill="#d8b4fe" class="tag">MediaRecorder</text>
    <rect x="638" y="76" width="95" height="18" rx="4" fill="#1e293b" />
    <text x="644" y="89" fill="#cbd5e1" class="tag">Audio WebM</text>

    <!-- Card 3: Acessibilidade 50+ Ativa -->
    <rect x="770" y="24" width="370" height="78" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="788" y="50" class="card-title">♿ Acessibilidade Ativa Integrada</text>
    <text x="788" y="68" class="card-subtitle">Zoom tipográfico A+/A-, leitor de página TTS e alto contraste</text>
    <rect x="788" y="76" width="95" height="18" rx="4" fill="#78350f" />
    <text x="794" y="89" fill="#fef3c7" class="tag">FontScale (A±)</text>
    <rect x="888" y="76" width="115" height="18" rx="4" fill="#451a03" />
    <text x="894" y="89" fill="#fde68a" class="tag">SpeechSynthesis</text>
    <rect x="1008" y="76" width="115" height="18" rx="4" fill="#1e293b" />
    <text x="1014" y="89" fill="#cbd5e1" class="tag">Máscaras &amp; Dicas</text>
  </g>

  <!-- Connector Line 1 to 2 -->
  <path d="M 210 227 L 210 263" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />
  <rect x="165" y="235" width="90" height="16" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="175" y="247" fill="#38bdf8" font-size="9" font-weight="700">HTTPS / SPA</text>

  <!-- ==================== CAMADA 2: FRONTEND ==================== -->
  <g transform="translate(30, 265)">
    <text x="0" y="12" fill="#22c55e" class="layer-title">CAMADA FRONTEND (VERCEL EDGE &amp; APP)</text>
    <line x1="280" y1="8" x2="1140" y2="8" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card 1: Vercel Edge Hosting -->
    <rect x="0" y="24" width="270" height="82" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="16" y="48" class="card-title">☁️ Vercel Edge Network</text>
    <text x="16" y="65" class="card-subtitle">Deploy contínuo • CDN Global • SSL</text>
    <text x="16" y="80" fill="#6ee7b7" class="tag">reconecta50-five.vercel.app</text>
    <rect x="16" y="86" width="130" height="16" rx="3" fill="#064e3b" />
    <text x="22" y="98" fill="#a7f3d0" font-size="9" font-weight="600">Alta Disponibilidade</text>

    <!-- Card 2: React Router v7 -->
    <rect x="285" y="24" width="280" height="82" rx="10" fill="#111827" stroke="#059669" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="301" y="48" class="card-title">🗺️ Jornada em 4 Passos</text>
    <text x="301" y="65" class="card-subtitle">React Router DOM 7 • Navegação fluida</text>
    <text x="301" y="80" fill="#cbd5e1" class="tag">1.Perfil ➔ 2.Currículo ➔ 3.Vagas ➔ 4.Envio</text>
    <rect x="301" y="86" width="115" height="16" rx="3" fill="#064e3b" />
    <text x="307" y="98" fill="#a7f3d0" font-size="9" font-weight="600">Guia Passo a Passo</text>

    <!-- Card 3: jsPDF Client Engine -->
    <rect x="580" y="24" width="270" height="82" rx="10" fill="#111827" stroke="#0d9488" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="596" y="48" class="card-title">📄 jsPDF Client Engine</text>
    <text x="596" y="65" class="card-subtitle">Exportação de PDF 100% no navegador</text>
    <text x="596" y="80" fill="#cbd5e1" class="tag">Layout limpo, acessível e imprimível</text>
    <rect x="596" y="86" width="145" height="16" rx="3" fill="#134e4a" />
    <text x="602" y="98" fill="#99f6e4" font-size="9" font-weight="600">Zero dependência de server</text>

    <!-- Card 4: Feedback de Cold-Start -->
    <rect x="865" y="24" width="275" height="82" rx="10" fill="#111827" stroke="#eab308" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="881" y="48" class="card-title">🔌 Tela de Conexão Ativa</text>
    <text x="881" y="65" class="card-subtitle">Tratamento do cold-start do Render</text>
    <text x="881" y="80" fill="#cbd5e1" class="tag">Polling inteligente em /api/health</text>
    <rect x="881" y="86" width="135" height="16" rx="3" fill="#713f12" />
    <text x="887" y="98" fill="#fde047" font-size="9" font-weight="600">Acolhimento na espera</text>
  </g>

  <!-- Connector Line 2 to 3 -->
  <path d="M 425 381 L 425 417" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="360" y="389" width="130" height="16" rx="4" fill="#0f172a" stroke="#16a34a" stroke-width="1" />
  <text x="368" y="401" fill="#4ade80" font-size="9" font-weight="700">REST / JSON + Cookies</text>

  <!-- ==================== CAMADA 3: API & BACKEND ==================== -->
  <g transform="translate(30, 420)">
    <text x="0" y="12" fill="#a855f7" class="layer-title">CAMADA API &amp; BACKEND (RENDER LINUX WEB SERVICE)</text>
    <line x1="390" y1="8" x2="1140" y2="8" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card 1: Express 5 + Node 22 -->
    <rect x="0" y="24" width="270" height="85" rx="10" fill="#111827" stroke="#9333ea" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="16" y="48" class="card-title">⚙️ Express 5 + Node.js 22</text>
    <text x="16" y="65" class="card-subtitle">reconectabackend.onrender.com</text>
    <text x="16" y="80" fill="#cbd5e1" class="tag">API modular • TypeScript nativo</text>
    <rect x="16" y="87" width="145" height="16" rx="3" fill="#581c87" />
    <text x="22" y="99" fill="#e9d5ff" font-size="9" font-weight="600">Runtime Moderno ESM</text>

    <!-- Card 2: Segurança & Middleware -->
    <rect x="285" y="24" width="280" height="85" rx="10" fill="#111827" stroke="#7e22ce" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="301" y="48" class="card-title">🛡️ authMiddleware &amp; CORS</text>
    <text x="301" y="65" class="card-subtitle">Sessões em Cookies httpOnly seguros</text>
    <text x="301" y="80" fill="#cbd5e1" class="tag">CORS restrito à Vercel oficial</text>
    <rect x="301" y="87" width="135" height="16" rx="3" fill="#3b0764" />
    <text x="307" y="99" fill="#d8b4fe" font-size="9" font-weight="600">bcryptjs + Salt seguro</text>

    <!-- Card 3: Blindagem IA & Guardrails -->
    <rect x="580" y="24" width="285" height="85" rx="10" fill="#111827" stroke="#a21caf" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="596" y="48" class="card-title">🔒 Blindagem de Prompt &amp; Filtros</text>
    <text x="596" y="65" class="card-subtitle">Anti-Jailbreak, anti-leak e isolamento</text>
    <text x="596" y="80" fill="#cbd5e1" class="tag">Sanitização &lt;relato&gt; • Limite 2k chars</text>
    <rect x="596" y="87" width="170" height="16" rx="3" fill="#701a75" />
    <text x="602" y="99" fill="#f5d0fe" font-size="9" font-weight="600">Enriquecimento ético s/ mentir</text>

    <!-- Card 4: Rotas & Controladores -->
    <rect x="880" y="24" width="260" height="85" rx="10" fill="#111827" stroke="#c026d3" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="896" y="48" class="card-title">📁 Rotas da Aplicação</text>
    <text x="896" y="65" class="card-subtitle">Controladores e stores isolados</text>
    <text x="896" y="80" fill="#cbd5e1" class="tag">/auth · /curriculo · /vagas · /candidaturas</text>
    <rect x="896" y="87" width="145" height="16" rx="3" fill="#701a75" />
    <text x="902" y="99" fill="#f5d0fe" font-size="9" font-weight="600">Arquitetura Desacoplada</text>
  </g>

  <!-- Connector Line 3 to 4 -->
  <path d="M 680 539 L 680 575" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <rect x="610" y="547" width="140" height="16" rx="4" fill="#0f172a" stroke="#9333ea" stroke-width="1" />
  <text x="618" y="559" fill="#d8b4fe" font-size="9" font-weight="700">Dual-Engine &amp; SQLite I/O</text>

  <!-- ==================== CAMADA 4: SERVIÇOS, IA & DADOS ==================== -->
  <g transform="translate(30, 580)">
    <text x="0" y="12" fill="#fb923c" class="layer-title">CAMADA SERVIÇOS, DUAL-ENGINE IA &amp; BANCO DE DADOS</text>
    <line x1="420" y1="8" x2="1140" y2="8" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card 1: 1º Motor IA - Groq Cloud -->
    <rect x="0" y="24" width="270" height="88" rx="10" fill="#111827" stroke="#f97316" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="16" y="48" class="card-title">⚡ 1º Motor: Groq Cloud (Primário)</text>
    <text x="16" y="65" class="card-subtitle">Llama 3.3 70B • Resposta em &lt; 1s</text>
    <text x="16" y="80" fill="#cbd5e1" class="tag">Timeout estrito de 7 segundos</text>
    <rect x="16" y="88" width="165" height="16" rx="3" fill="#7c2d12" />
    <text x="22" y="100" fill="#ffedd5" font-size="9" font-weight="600">Altíssima velocidade para UX</text>

    <!-- Card 2: 2º Motor IA - Google Gemini -->
    <rect x="285" y="24" width="280" height="88" rx="10" fill="#111827" stroke="#ea580c" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="301" y="48" class="card-title">🧠 2º Motor: Google Gemini (Fallback)</text>
    <text x="301" y="65" class="card-subtitle">Gemini 2.5 Flash • Redundância ativa</text>
    <text x="301" y="80" fill="#cbd5e1" class="tag">Assume se Groq falhar, timeout ou 429</text>
    <rect x="301" y="88" width="165" height="16" rx="3" fill="#7c2d12" />
    <text x="307" y="100" fill="#ffedd5" font-size="9" font-weight="600">Zero bloqueio por oscilação</text>

    <!-- Card 3: SQLite Nativo -->
    <rect x="580" y="24" width="270" height="88" rx="10" fill="#111827" stroke="#0284c7" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="596" y="48" class="card-title">💾 SQLite Nativo (node:sqlite)</text>
    <text x="596" y="65" class="card-subtitle">Persistência local no arquivo reconecta50.db</text>
    <text x="596" y="80" fill="#cbd5e1" class="tag">Users · Currículos · Candidaturas</text>
    <rect x="596" y="88" width="170" height="16" rx="3" fill="#075985" />
    <text x="602" y="100" fill="#e0f2fe" font-size="9" font-weight="600">Zero compilação nativa C++</text>

    <!-- Card 4: Catálogo de Vagas & Matching -->
    <rect x="865" y="24" width="275" height="88" rx="10" fill="#111827" stroke="#16a34a" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="881" y="48" class="card-title">🎯 Catálogo &amp; Matching 50+</text>
    <text x="881" y="65" class="card-subtitle">40 vagas afirmativas e estruturadas</text>
    <text x="881" y="80" fill="#cbd5e1" class="tag">Algoritmo de afinidade de competências</text>
    <rect x="881" y="88" width="170" height="16" rx="3" fill="#166534" />
    <text x="887" y="100" fill="#dcfce7" font-size="9" font-weight="600">Filtros afirmativos maduros</text>
  </g>

  <!-- Connector Line 4 to 5 -->
  <path d="M 210 702 L 210 738" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowYellow)" />
  <rect x="155" y="710" width="110" height="16" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="1" />
  <text x="163" y="722" fill="#fde047" font-size="9" font-weight="700">CI / CD &amp; Pipeline</text>

  <!-- ==================== CAMADA 5: CI/CD & QUALIDADE ==================== -->
  <g transform="translate(30, 740)">
    <text x="0" y="12" fill="#eab308" class="layer-title">CAMADA CI/CD, QUALIDADE &amp; SEGURANÇA</text>
    <line x1="330" y1="8" x2="1140" y2="8" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card 1: GitHub Actions -->
    <rect x="0" y="24" width="270" height="74" rx="10" fill="#111827" stroke="#ca8a04" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="16" y="48" class="card-title">🚀 GitHub Actions</text>
    <text x="16" y="65" class="card-subtitle">CI/CD automatizado • PR checks</text>
    <rect x="16" y="73" width="145" height="16" rx="3" fill="#713f12" />
    <text x="22" y="85" fill="#fef08a" font-size="9" font-weight="600">Deploy Vercel &amp; Render</text>

    <!-- Card 2: Vitest & Testes -->
    <rect x="285" y="24" width="280" height="74" rx="10" fill="#111827" stroke="#ca8a04" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="301" y="48" class="card-title">🧪 Vitest + React Testing Library</text>
    <text x="301" y="65" class="card-subtitle">Testes unitários e componentes 50+</text>
    <rect x="301" y="73" width="130" height="16" rx="3" fill="#713f12" />
    <text x="307" y="85" fill="#fef08a" font-size="9" font-weight="600">Garantia de Qualidade</text>

    <!-- Card 3: ESLint + TypeScript -->
    <rect x="580" y="24" width="270" height="74" rx="10" fill="#111827" stroke="#ca8a04" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="596" y="48" class="card-title">🔧 ESLint 9 + TypeScript TSC</text>
    <text x="596" y="65" class="card-subtitle">Verificação estrita de tipos sem `any`</text>
    <rect x="596" y="73" width="145" height="16" rx="3" fill="#713f12" />
    <text x="602" y="85" fill="#fef08a" font-size="9" font-weight="600">Padrões de Código Limpo</text>

    <!-- Card 4: Prettier & Formatação -->
    <rect x="865" y="24" width="275" height="74" rx="10" fill="#111827" stroke="#ca8a04" stroke-width="1.8" filter="url(#cardShadow)" />
    <text x="881" y="48" class="card-title">🧹 Prettier &amp; Scripts</text>
    <text x="881" y="65" class="card-subtitle">Padronização de formatação automática</text>
    <rect x="881" y="73" width="125" height="16" rx="3" fill="#713f12" />
    <text x="887" y="85" fill="#fef08a" font-size="9" font-weight="600">Consistência Total</text>
  </g>

  <!-- Footer Stats & Legend -->
  <g transform="translate(30, 855)">
    <rect x="0" y="0" width="1140" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
    
    <circle cx="25" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="25" fill="#cbd5e1" font-size="11" font-weight="600">Cliente / UI</text>

    <circle cx="140" cy="21" r="5" fill="#22c55e" />
    <text x="151" y="25" fill="#cbd5e1" font-size="11" font-weight="600">Frontend Vercel</text>

    <circle cx="280" cy="21" r="5" fill="#c084fc" />
    <text x="291" y="25" fill="#cbd5e1" font-size="11" font-weight="600">Backend &amp; API</text>

    <circle cx="410" cy="21" r="5" fill="#fb923c" />
    <text x="421" y="25" fill="#cbd5e1" font-size="11" font-weight="600">Dual-Engine IA &amp; Dados</text>

    <circle cx="590" cy="21" r="5" fill="#facc15" />
    <text x="601" y="25" fill="#cbd5e1" font-size="11" font-weight="600">CI/CD</text>

    <text x="730" y="25" fill="#94a3b8" font-size="11">Total: <tspan fill="#4ade80" font-weight="700">100% Client-Side PDF</tspan> • <tspan fill="#f97316" font-weight="700">2 Motores IA com Fallback</tspan> • <tspan fill="#38bdf8" font-weight="700">Persistência SQLite Nativa</tspan></text>
  </g>
</svg>